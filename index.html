<!DOCTYPE html> 
<html lang="id"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Pendaftaran Workshop</title> 
  <!-- Memanggil Bootstrap 5 --> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 

</head> 
<body class="bg-body-tertiary"> 
  <main class="container py-5" style="max-width: 540px;"> 
    <div class="card shadow-sm"> 
      <div class="card-body p-4"> 
        <h1 class="h3 mb-4">Pendaftaran Workshop Web</h1> 
 
        <form id="formDaftar" novalidate> 
          <div class="mb-3"> 
            <label for="nama" class="form-label">Nama lengkap</label> 
            <input id="nama" type="text" class="form-control" placeholder="Contoh: Andi Pratama" required minlength="3">
            <div id="nama-error" class="invalid-feedback"></div> 
          </div> 
 
          <div class="mb-3"> 
            <label for="email" class="form-label">Email</label> 
            <input id="email" type="email" class="form-control" placeholder="nama@domain.com"> 
            <div id="email-hint" class="form-text">Contoh: nama@domain.com</div> 
            <div id="email-error" class="invalid-feedback"></div> 
          </div> 
 
          <div class="mb-3"> 
            <label for="hp" class="form-label">Nomor WhatsApp</label> 
            <input id="hp" type="text" class="form-control" placeholder="081234567890" pattern="^08[0-9]{8,11}$" required>
            <div id="hp-hint" class="form-text">Diawali 08, 10-13 digit</div> 
            <div id="hp-error" class="invalid-feedback"></div> 
          </div> 

          <div class="mb-3"> 
            <label for="password" class="form-label">Password</label> 
            <input id="password" type="text" class="form-control" placeholder="Buat password kamu" required minlength="6"> 
            <div id="password-hint" class="form-text">password minimal 6 karakter</div> 
            <div id="password-error" class="invalid-feedback"></div> 
          </div> 

          <div class="mb-3"> 
            <label for="retypePassword" class="form-label">Tulis ulang password</label> 
            <input id="retypePassword" type="text" class="form-control" placeholder="Tulis ulang password kamu" required> 
            <div id="password-hint" class="form-text">tulis ulang password</div> 
            <div id="retypePassword-error" class="invalid-feedback"></div> 
          </div> 
          
 
          <div class="mb-4"> 
            <label for="tanggal" class="form-label">Tanggal Lahir</label> 
            <input id="tanggal" type="date" class="form-control" max=""> 
            <div id="tanggal-error" class="invalid-feedback"></div> 
          </div> 
 
          <button id="tombolKirim" type="submit" class="btn btn-success w-100">Daftar</button> 
          <div id="statusForm"></div> 
        </form> 
      </div> 
    </div> 
  </main> 
<script src="script.js"></script> 
</body> 
</html>
